[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-inference-server"
version = "0.1.0"
description = "LLM inference server with an OpenAI-compatible API."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Juan Martos Cuevas", email = "martoscuevasjuan@gmail.com" }]
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.22",
    "pydantic>=2.0",
    "numpy>=1.20",
    "jinja2>=3.1",
]

[project.optional-dependencies]
llamacpp = ["llama-cpp-python>=0.3.16"]
mlx = ["mlx>=0.32", "mlx-lm>=0.32"]
torch = ["torch>=2.1", "transformers>=4.45"]
bench = ["httpx>=0.24"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["llm_inference_server"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
